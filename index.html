<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's 3D Globe with CDN Texture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: url('back.png') no-repeat center center fixed;
      background-size: cover;
      background-color: black;
    }
    #globeContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 24px;
    }
  </style>
</head>
<body>

<div id="globeContainer"></div>
<div id="loading">Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

<script>
  // Constants
  const GLOBE_RADIUS = 1;
  const ROTATION_SPEED = 0.0015;
  const TEXTURE_URL = 'https://cdn.jsdelivr.net/gh/Chalarangelo/static-hosted-assets/earthmap1k.jpg';

  // Scene setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.getElementById('globeContainer').appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // Texture loading
  const loader = new THREE.TextureLoader();
  const loadingManager = new THREE.LoadingManager(
    // onLoad
    () => {
      document.getElementById('loading').style.display = 'none';
    },
    // onProgress
    (url, loaded, total) => {
      const progress = (loaded / total) * 100;
      document.getElementById('loading').textContent = `Loading... ${Math.round(progress)}%`;
    },
    // onError
    (url) => {
      console.error('Error loading texture:', url);
      document.getElementById('loading').textContent = 'Error loading texture. Please refresh.';
    }
  );

  loader.setManager(loadingManager);

  loader.load(TEXTURE_URL, 
    (texture) => {
      const geometry = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
      const material = new THREE.MeshPhongMaterial({
        map: texture,
        emissive: 0x222222,
        emissiveIntensity: 0.8
      });

      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += ROTATION_SPEED;
        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    },
    undefined,
    (error) => {
      console.error('Error loading texture:', error);
      document.getElementById('loading').textContent = 'Error loading texture. Please refresh.';
    }
  );

  // Window resize handler
  const handleResize = () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  };

  window.addEventListener('resize', handleResize);

  // Cleanup function
  const cleanup = () => {
    window.removeEventListener('resize', handleResize);
    controls.dispose();
    renderer.dispose();
  };

  // Cleanup on page unload
  window.addEventListener('unload', cleanup);
</script>

</body>
</html>
