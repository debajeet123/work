<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's Spinning Background Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: black;
      font-family: sans-serif;
      overflow: hidden;
      color: #ffffff;
    }
    #globeCanvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: -1;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 100px auto;
      padding: 40px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 12px;
    }
    h1 {
      color: #00ffe1;
      margin-top: 0;
    }
    p {
      font-size: 18px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="globeCanvas"></div>

  <div class="content">
    <h1>Welcome to Debajeet's Globe</h1>
    <p>This is a full-page spinning 3D globe background with transparent content sections floating above.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    document.getElementById("globeCanvas").appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    loader.load('https://raw.githubusercontent.com/josephsurin/earth-globe-threejs/main/textures/earthmap1k.jpg', function(texture) {
      const geometry = new THREE.SphereGeometry(5, 64, 64);
      const material = new THREE.MeshPhongMaterial({ map: texture });
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      const ambientLight = new THREE.AmbientLight(0x888888);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(5, 3, 5);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002;
        renderer.render(scene, camera);
      }
      animate();
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
