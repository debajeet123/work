<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's 3D Rotating Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000; /* Dark space background */
    }
    #globeContainer {
      width: 100vw; 
      height: 100vh; 
    }
  </style>
</head>
<body>

<!-- Container for the Globe -->
<div id="globeContainer"></div>

<!-- Import Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
  // === Parameters (Replace these with values from Python GUI) ===
  const canvasWidth = window.innerWidth;      // Full window width
  const canvasHeight = window.innerHeight;    // Full window height
  const globeRadius = 1;                      // Radius of the sphere
  const rotationSpeed = 0.0015;                // Speed of rotation (radians per frame)

  // === Basic Three.js Setup ===
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, canvasWidth / canvasHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(canvasWidth, canvasHeight);
  document.getElementById('globeContainer').appendChild(renderer.domElement);

  // === Lighting ===
  const ambientLight = new THREE.AmbientLight(0x555555);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  // === Load Globe Texture ===
  const loader = new THREE.TextureLoader();
  loader.load('https://raw.githubusercontent.com/ajayns/earth-js/master/images/earth-night.jpg', (texture) => {
    const geometry = new THREE.SphereGeometry(globeRadius, 64, 64);
    const material = new THREE.MeshPhongMaterial({ 
      map: texture,
      emissive: 0x111111,
      emissiveIntensity: 0.5
    });

    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    // === Animation Loop ===
    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += rotationSpeed; // Rotate the globe
      renderer.render(scene, camera);
    }

    animate();
  });

  // === Handle Window Resize ===
  window.addEventListener('resize', () => {
    const newWidth = window.innerWidth;
    const newHeight = window.innerHeight;
    renderer.setSize(newWidth, newHeight);
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
  });

</script>

</body>
</html>
