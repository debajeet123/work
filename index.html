<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's Corner Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0d0d;
      font-family: sans-serif;
    }
    #globeCanvas {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 250px;
      height: 250px;
      z-index: 10;
      pointer-events: none;
    }
    .content {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      color: #eee;
    }
    h1 {
      color: #00ffe1;
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Welcome to Debajeet's Site</h1>
    <p>This page features a 3D rotating globe in the top-right corner using pure Three.js.</p>
  </div>

  <div id="globeCanvas"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(250, 250);
    renderer.setClearColor(0x000000, 0);  // transparent background
    document.getElementById("globeCanvas").appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    loader.load('https://raw.githubusercontent.com/josephsurin/earth-globe-threejs/main/textures/earthmap1k.jpg', texture => {
      const geometry = new THREE.SphereGeometry(5, 64, 64);
      const material = new THREE.MeshPhongMaterial({ map: texture });
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      const ambientLight = new THREE.AmbientLight(0x888888);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 3, 5);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002;
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
