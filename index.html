<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet Barman – 3D Globe with Real Background</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black; /* fallback */
    }
    #globeContainer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

<div id="globeContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
  const globeRadius = 1;
  const rotationSpeed = 0.0015;

  const scene = new THREE.Scene();

  // LOAD back.png AS SCENE BACKGROUND (REAL way)
  new THREE.TextureLoader().load('back.png', (texture) => {
    scene.background = texture;
  });

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true });  // NO alpha needed
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('globeContainer').appendChild(renderer.domElement);

  // Lighting (normal)
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  const loader = new THREE.TextureLoader();
  loader.load('https://raw.githubusercontent.com/ajayns/earth-js/master/images/earth-night.jpg', (texture) => {
    const geometry = new THREE.SphereGeometry(globeRadius, 64, 64);
    const material = new THREE.MeshPhongMaterial({
      map: texture,
      emissive: 0x222222,
      emissiveIntensity: 0.8
    });

    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += rotationSpeed;
      renderer.render(scene, camera);
    }

    animate();
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
