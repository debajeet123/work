<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's Corner Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0d0d0d;
      font-family: sans-serif;
      overflow-x: hidden;
    }
    .content {
      padding: 40px;
      max-width: 800px;
      margin: 0 auto;
      color: #eee;
    }
    h1 {
      color: #00ffe1;
    }
    #cornerGlobe {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 200px;
      height: 200px;
      z-index: 999;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="content">
    <h1>Hi, I'm Debajeet</h1>
    <p>This is a test of a 3D Earth using Three.js in the top-right corner.</p>
  </div>

  <div id="cornerGlobe"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(200, 200);
    renderer.setClearColor(0x000000, 0); // transparent
    document.getElementById("cornerGlobe").appendChild(renderer.domElement);

    const loader = new THREE.TextureLoader();
    loader.load('https://raw.githubusercontent.com/josephsurin/earth-globe-threejs/main/textures/earthmap1k.jpg', texture => {
      const geometry = new THREE.SphereGeometry(5, 64, 64);
      const material = new THREE.MeshPhongMaterial({ map: texture });
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      scene.add(new THREE.AmbientLight(0x888888));
      const light = new THREE.DirectionalLight(0xffffff, 0.9);
      light.position.set(5, 3, 5);
      scene.add(light);

      function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002;
        renderer.render(scene, camera);
      }
      animate();
    });
  </script>
</body>
</html>
