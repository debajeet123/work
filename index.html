<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet Barman – 3D Globe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    #globeContainer {
      width: 100vw;
      height: 100vh;
    }
    footer {
      position: absolute;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>
<body>

<div id="globeContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
  const globeRadius = 1;
  const rotationSpeed = 0.0015;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('globeContainer').appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x404040, 1.5);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  const loader = new THREE.TextureLoader();
  loader.load('https://raw.githubusercontent.com/ajayns/earth-js/master/images/earth-night.jpg', (texture) => {
    const geometry = new THREE.SphereGeometry(globeRadius, 64, 64);
    const material = new THREE.MeshPhongMaterial({ 
      map: texture,
      emissive: 0x111111,
      emissiveIntensity: 0.6
    });

    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += rotationSpeed;
      renderer.render(scene, camera);
    }

    animate();
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
</script>

<footer>
  © Debajeet Barman – Geophysicist
</footer>

</body>
</html>
