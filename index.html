<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debajeet's 3D Globe over Background</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      background: url('back.png') no-repeat center center fixed;
      background-size: cover;
      background-color: black; /* fallback if back.png not available */
    }
    #globeContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* allows background clicks if needed */
    }
  </style>
</head>
<body>

<!-- 3D Globe will render inside this div -->
<div id="globeContainer"></div>

<!-- Import Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
  const globeRadius = 1;
  const rotationSpeed = 0.0015;

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 3;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: true = transparent
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0); // Full transparency
  document.getElementById('globeContainer').appendChild(renderer.domElement);

  // Lighting setup
  const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
  scene.add(ambientLight);

  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
  directionalLight.position.set(5, 3, 5);
  scene.add(directionalLight);

  // Load Earth texture
  const loader = new THREE.TextureLoader();
  loader.load('https://raw.githubusercontent.com/ajayns/earth-js/master/images/earth-night.jpg', (texture) => {
    const geometry = new THREE.SphereGeometry(globeRadius, 64, 64);
    const material = new THREE.MeshPhongMaterial({
      map: texture,
      emissive: 0x222222,
      emissiveIntensity: 0.8
    });

    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    // Animate
    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += rotationSpeed;
      renderer.render(scene, camera);
    }

    animate();
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });
</script>

</body>
</html>
