<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Debajeet Barman – Geophysicist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="globe.css" />
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
</head>
<body>
  <div class="strata-layer"></div>
  <div id="topRightGlobe"></div>
  <div class="profile-photo"><img src="profile.jpg" alt="Debajeet Barman"></div>
  <canvas id="rickerCanvas"></canvas>
  <div class="tabs-wrapper">
    <nav class="tabs-nav">
      <a class="tab-link" href="#home">Home</a>
      <a class="tab-link" href="#about">About</a>
      <a class="tab-link" href="#projects">Projects</a>
      <a class="tab-link" href="#publications">Publications</a>
      <a class="tab-link" href="#resume">Resume</a>
      <a class="tab-link" href="#contact">Contact</a>
    </nav>
  </div>

  <section id="home" class="tab-section">
    <h1>Welcome</h1>
    <p><span class="typewriter">Exploring the geophysical cosmos...</span></p>
  </section>
  <section id="about" class="tab-section">
    <h1>About</h1>
    <p>Ph.D. candidate in geophysics...</p>
  </section>
  <div class="info-card">
    <a href="https://linkedin.com/in/debajeetbarman" target="_blank">LinkedIn</a> |
    <a href="https://scholar.google.com/citations?user=_i8vIAEAAAAJ" target="_blank">Google Scholar</a>
  </div>
  <script src="globe.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const tabLinks = document.querySelectorAll('.tab-link');
    const tabSections = document.querySelectorAll('.tab-section');

    // Show home section by default
    document.querySelector('#home').classList.add('active');

    tabLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('href').substring(1);

        // Hide all sections
        tabSections.forEach(section => {
          section.classList.remove('active');
        });

        // Show target section
        const targetSection = document.getElementById(targetId);
        if (targetSection) {
          targetSection.classList.add('active');
        }
      });
    });
  });
  </script>
</body>
</html>
