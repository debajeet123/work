<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArcGIS JS: 3D Topographic Scene</title>
  <!-- 1) Pull in the ArcGIS CSS -->
  <link
    rel="stylesheet"
    href="https://js.arcgis.com/4.26/esri/themes/light/main.css"
  />
  <style>
    html,
    body,
    #viewDiv {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <!-- 2) Container for the 3D view -->
  <div id="viewDiv"></div>

  <!-- 3) Load the ArcGIS API for JavaScript -->
  <script src="https://js.arcgis.com/4.26/"></script>
  <script>
    require([
      "esri/Map",
      "esri/views/SceneView",
      "esri/layers/ElevationLayer",
      "esri/layers/ImageryLayer"
    ], function (Map, SceneView, ElevationLayer, ImageryLayer) {
      // ---------------------------------------------
      // 1) Create an ElevationLayer (terrain service)
      // ---------------------------------------------
      // Esri’s World Elevation (Terrain3D) REST endpoint:
      const elevation = new ElevationLayer({
        url:
          "https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer"
      });

      // ---------------------------------------------
      // 2) (Optional) Create an ImageryLayer to drape over terrain
      //    – You could swap this for any raster/orthophoto/Tiles service
      //    – If you don’t need a custom texture, you can skip this.
      // ---------------------------------------------
      const imagery = new ImageryLayer({
        // Example: World Imagery REST endpoint
        url:
          "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
      });

      // ---------------------------------------------
      // 3) Build the Map, specifying basemap & ground
      // ---------------------------------------------
      const map = new Map({
        // You can use any 2D or 3D basemap. “topo-vector” is common for topo.
        basemap: "topo-vector",
        // The ground property tells ArcGIS which elevation to use.
        ground: {
          // Pass an array of ElevationLayer(s)
          layers: [elevation]
        }
      });

      // ---------------------------------------------
      // 4) Create the SceneView for 3D
      // ---------------------------------------------
      const view = new SceneView({
        container: "viewDiv",
        map: map,
        // We set a camera to look at a specific location (latitude, longitude, z)
        camera: {
          // For example, look at Mount Rainier (47.6062, –122.3321) from above:
          position: {
            // Coordinates in WGS84 (lon, lat, elevation in meters)
            x: -122.3321,
            y: 47.6062,
            z: 2000 // in meters above ground
          },
          tilt: 65, // tilt the camera down so you see slope
          heading: 0
        }
      });

      // ---------------------------------------------
      // 5) Once the view is ready, add the ImageryLayer draped on terrain
      // ---------------------------------------------
      view.when().then(function () {
        // By default, 2D layers in a SceneView will drape onto the terrain.
        // So we can just add the imagery layer to the map’s layer list:
        map.add(imagery);

        // (Optional) Adjust the renderer or transparency if desired:
        imagery.opacity = 0.75;
      });

      // ---------------------------------------------
      // 6) Add widgets or UI (optional)
      // ---------------------------------------------
      // For example, add a simple “Home” button in the top-left:
      view.ui.add("homeWidget", "top-left");
    });
  </script>
</body>
</html>
