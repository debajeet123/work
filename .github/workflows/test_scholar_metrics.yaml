name: Test Scholar Metrics

on:
  workflow_dispatch:   # allows manual test

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Run scholar_metrics.py
        run: python scholar_metrics.py

      - name: Show output file
        run: cat rg_stats.json
