name: Update Google Scholar Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:       # allow manual run

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install scholarly bs4 requests

      - name: Run Scholar Metrics Script
        run: python scholar_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add rg_stats.json
          git commit -m "Auto-update Google Scholar metrics" || echo "No changes"
          git push
