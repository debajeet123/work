name: Update Google Scholar Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run scholar_metrics.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scholar_metrics.py

      # -------------------------
      # FIXED GIT LOGIC
      # -------------------------
      - name: Commit updated metrics
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

          # Stage the updated file BEFORE pulling
          git add rg_stats.json || true
          git commit -m "Auto-update Scholar metrics" || true

          # Detect correct branch (main or master)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $BRANCH"

          # Pull latest changes WITHOUT rebase to avoid conflict
          git pull origin $BRANCH --no-rebase || true

          # Push the update
          git push origin $BRANCH || true
