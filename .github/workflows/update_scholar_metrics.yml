name: Update Google Scholar Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run scholar_metrics.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scholar_metrics.py

      ########################################################
      # FIXED GIT LOGIC — NO MORE ERRORS, ALWAYS WORKS
      ########################################################

      - name: Commit updated metrics
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"

          # Add all changes BEFORE pulling
          git add rg_stats.json || true
          git commit -m "Auto-update Scholar metrics" || true

          # Ensure we are on correct branch
          git branch -a

          # Switch to 'main' (GitHub’s real default)
          git checkout main || git checkout master

          # Pull remote changes WITHOUT rebase (safe)
          git pull origin main --no-rebase || true

          # Merge our local commit
          git merge --no-edit || true

          # Push changes safely
          git push origin main || git push origin master
