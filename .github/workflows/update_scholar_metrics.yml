name: Update Google Scholar Metrics

on:
  workflow_dispatch:   # allows you to test manually
  schedule:
    - cron: "0 0 * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run scholar_metrics.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scholar_metrics.py

      - name: Commit updated metrics
        run: |
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git pull origin master --rebase || true
          git add rg_stats.json
          git commit -m "Auto-update Scholar metrics" || echo "No changes"
          git push origin master
